<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>wifitalkie case</title>
  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #f4f4f2; font-family: sans-serif; }
    model-viewer { width: 100%; height: 100%; }
    #bar { position: fixed; left: 12px; top: 10px; display: flex; gap: 6px; }
    #bar button { padding: 6px 12px; border: 1px solid #999; background: #fff;
                  border-radius: 4px; cursor: pointer; font-size: 14px; }
    #bar button.on { background: #333; color: #fff; }
    #hint { position: fixed; left: 12px; bottom: 10px; color: #555; font-size: 13px; }
  </style>
</head>
<body>
  <model-viewer id="mv" src="exports/closed.glb" alt="wifitalkie case"
    camera-controls interaction-prompt="none" shadow-intensity="1"
    exposure="1.6" tone-mapping="neutral" environment-image="neutral" camera-orbit="-10deg 30deg auto">
  </model-viewer>
  <div id="bar">
    <button data-f="exploded">exploded</button>
    <button data-f="closed" class="on">closed</button>
    <button data-f="front">front shell</button>
    <button data-f="back">back shell</button>
    <button data-f="test">fit test</button>
  </div>
  <div id="hint">drag = rotate · scroll = zoom · right-drag = pan</div>
  <script>
    const mv = document.getElementById('mv');
    for (const b of document.querySelectorAll('#bar button')) {
      b.onclick = () => {
        mv.src = `exports/${b.dataset.f}.glb?v=${Date.now()}`;
        document.querySelectorAll('#bar button').forEach(x => x.classList.toggle('on', x === b));
      };
    }
    // viewer.html?f=test opens straight on one model
    const f = new URLSearchParams(location.search).get('f');
    const pick = f && document.querySelector(`#bar button[data-f="${f}"]`);
    if (pick) pick.click();
  </script>
</body>
</html>
